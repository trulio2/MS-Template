server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/nest {
        return 308 /api/nest/;
    }

    location /api/nest/ {
        rewrite ^/api/nest/(.*)$ /$1 break;
        set $nest_upstream http://nest:3000;
        proxy_pass $nest_upstream;
    }

    location = /api/node {
        return 308 /api/node/;
    }

    location /api/node/ {
        rewrite ^/api/node/(.*)$ /$1 break;
        set $node_upstream http://node:3001;
        proxy_pass $node_upstream;
    }

    location = /api/python {
        return 308 /api/python/;
    }

    location /api/python/ {
        rewrite ^/api/python/(.*)$ /$1 break;
        set $python_upstream http://python:8000;
        proxy_pass $python_upstream;
    }

    location = /api/go {
        return 308 /api/go/;
    }

    location /api/go/ {
        rewrite ^/api/go/(.*)$ /$1 break;
        set $go_upstream http://go:8080;
        proxy_pass $go_upstream;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"message":"API route not found"}';
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
