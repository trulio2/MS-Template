server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/nest {
        return 308 /api/nest/;
    }

    location /api/nest/ {
        proxy_pass http://nest:3000/;
    }

    location = /api/node {
        return 308 /api/node/;
    }

    location /api/node/ {
        proxy_pass http://node:3001/;
    }

    location = /api/python {
        return 308 /api/python/;
    }

    location /api/python/ {
        proxy_pass http://python:8000/;
    }

    location = /api/go {
        return 308 /api/go/;
    }

    location /api/go/ {
        proxy_pass http://go:8080/;
    }

    location / {
        default_type application/json;
        return 404 '{"message":"Route not found"}';
    }
}
