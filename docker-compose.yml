services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/dist:/usr/share/nginx/html:ro
    depends_on:
      - nest
      - node
      - python
      - go

  nest:
    build:
      context: ./nest
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://nest:nest@postgres:5432/nest
      DATABASE_SSL: 'false'
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672
      OTEL_SERVICE_NAME: nest
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: 'service.name=nest,service.version=1.0.0'
      OTEL_METRICS_EXPORTER: otlproto
      OTEL_LOGS_EXPORTER: otlproto
    volumes:
      - ./nest:/app
      - nest_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  node:
    build:
      context: ./node
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://nest:nest@postgres:5432/nest
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672
      OTEL_SERVICE_NAME: node
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: 'service.name=node,service.version=1.0.0'
    volumes:
      - ./node:/app
      - node_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  python:
    build:
      context: ./python
    volumes:
      - ./python:/app
    environment:
      DATABASE_URL: postgresql://nest:nest@postgres:5432/nest
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672
      OTEL_SERVICE_NAME: python
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: 'service.name=python,service.version=1.0.0'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  go:
    build:
      context: ./go
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://nest:nest@postgres:5432/nest
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672
      OTEL_SERVICE_NAME: go
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: 'service.name=go,service.version=1.0.0'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  loki:
    image: grafana/loki:3.3.0
    command: ['--config.file=/etc/loki/loki.yml']
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'

  tempo:
    image: grafana/tempo:2.7.1
    command: ['--config.file=/etc/tempo/tempo.yml']
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - '3200:3200'

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3002:3000'
    depends_on:
      - prometheus
      - loki
      - tempo

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest -d nest']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nest_node_modules:
  node_node_modules:
  postgres_data:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
