services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./react/dist:/usr/share/nginx/html:ro
    depends_on:
      - nest
      - node
      - python
      - go

  nest:
    build:
      context: ./nest
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://nest:nest@postgres:5432/nest
      DATABASE_SSL: 'false'
    volumes:
      - ./nest:/app
      - nest_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  node:
    build:
      context: ./node
    environment:
      PORT: 3001
    volumes:
      - ./node:/app

  python:
    build:
      context: ./python
    volumes:
      - ./python:/app

  go:
    build:
      context: ./go
    environment:
      PORT: 8080
    volumes:
      - ./go:/app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest -d nest']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nest_node_modules:
  postgres_data:
  rabbitmq_data:
  redis_data:
