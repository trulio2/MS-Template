services:
  nest:
    build:
      context: ./nest
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://nest:nest@postgres:5432/nest
      DATABASE_SSL: 'false'
    volumes:
      - ./nest:/app
      - nest_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  node:
    build:
      context: ./node
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
    volumes:
      - ./node:/app

  python:
    build:
      context: ./python
    ports:
      - '8000:8000'
    volumes:
      - ./python:/app

  go:
    build:
      context: ./go
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
    volumes:
      - ./go:/app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest -d nest']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nest_node_modules:
  postgres_data:
  rabbitmq_data:
  redis_data:
